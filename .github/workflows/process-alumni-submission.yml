name: 处理校友收录申请

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  approve:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'alumni-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse Issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const body = issue.body ?? ''
            const emptyAnswer = /^_No response_$/i
            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const readAnswer = (label) => {
              const pattern = new RegExp(`### ${escapeRegExp(label)}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`)
              const value = body.match(pattern)?.[1].trim() ?? ''
              return emptyAnswer.test(value) ? '' : value
            }
            const normalizeGitHubUsername = (value) => value
              .trim()
              .replace(/^@/, '')
              .replace(/^https?:\/\/github\.com\//i, '')
              .replace(/[/?#].*$/, '')

            const nickname = readAnswer('昵称')
            const githubUser = normalizeGitHubUsername(readAnswer('GitHub 用户名'))
            const blogUrl = readAnswer('博客/主页（可选）') || readAnswer('博客地址（可选）')
            const blogName = readAnswer('博客名称（可选）') || nickname

            if (!nickname || !githubUser) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '解析失败：缺少昵称或 GitHub 用户名。'
              })
              core.setFailed('Missing required fields')
              return
            }

            if (blogUrl) {
              try {
                const url = new URL(blogUrl)
                if (!/^https?:$/.test(url.protocol)) throw new Error('invalid protocol')
              } catch {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '博客/主页地址格式不正确，请使用 http(s) URL。'
                })
                core.setFailed('Invalid blog URL')
                return
              }
            }

            try {
              await github.rest.users.getByUsername({ username: githubUser })
            } catch {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `GitHub 用户名 \`${githubUser}\` 不存在，请检查。`
              })
              core.setFailed('Invalid GitHub username')
              return
            }

            core.setOutput('nickname', nickname)
            core.setOutput('github_user', githubUser)
            core.setOutput('blog_url', blogUrl)
            core.setOutput('blog_name', blogName)
            core.setOutput('issue_number', issue.number)

      - name: Upsert alumni data
        id: upsert
        env:
          NICKNAME: ${{ steps.parse.outputs.nickname }}
          GITHUB_USERNAME: ${{ steps.parse.outputs.github_user }}
          BLOG_URL: ${{ steps.parse.outputs.blog_url }}
          BLOG_NAME: ${{ steps.parse.outputs.blog_name }}
        run: node scripts/apply-submission.mjs alumni

      - name: Validate data
        run: npm --prefix frontend run validate:data

      - name: Generate README
        run: node scripts/generate-readme.mjs

      - name: Collect blog posts
        run: npm --prefix frontend run collect:posts
        continue-on-error: true

      - name: Commit and Push
        env:
          COMMIT_SUBJECT: ${{ steps.upsert.outputs.commit_subject }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alumni.json README.md data/blog-posts.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "feat: ${COMMIT_SUBJECT}"
          git push

      - name: Close Issue
        if: success()
        uses: actions/github-script@v7
        env:
          BLOG_URL: ${{ steps.parse.outputs.blog_url }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          SUMMARY: ${{ steps.upsert.outputs.summary }}
        with:
          script: |
            const blogLine = process.env.BLOG_URL ? `\n博客：${process.env.BLOG_URL}` : ''

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `${process.env.SUMMARY}成功。${blogLine}\n\n稍后会展示在 ZZULI.dev。`
            })

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed'
            })

  reject:
    if: github.event.label.name == 'rejected' && contains(github.event.issue.labels.*.name, 'alumni-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '这次申请未通过审核。如需补充信息，可以重新提交。'
            })

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
